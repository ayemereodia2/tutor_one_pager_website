<script>

const icons = n => `<svg class="icon" aria-hidden="true"><use href="#ic-${n}"></use></svg>`;

const navs = {

};

const lessons=[
 {id:'angles',title:'Angles & quadrilaterals',topic:'Geometry',desc:'Discover why the angles inside a quadrilateral add to 360°.',level:'Grade 10',detail:'Draw one diagonal',pct:60},
 {id:'equations',title:'Linear equations',topic:'Algebra',desc:'Balance equations and isolate an unknown quantity.',level:'Grade 10',detail:'Solve 4x + 7 = 19',pct:25},
 {id:'triangles',title:'Triangles & area',topic:'Geometry',desc:'Use visual models to connect base, height and area.',level:'Grade 10',detail:'Find area from base and height',pct:0},
 {id:'whole',title:'Whole numbers',topic:'Number sense',desc:'Explore place value and compare whole numbers visually.',level:'JSS 1',detail:'Place-value charts',pct:0},
 {id:'fractions',title:'Fractions',topic:'Number sense',desc:'Understand part-whole relationships with pictures.',level:'JSS 1',detail:'Compare equal parts',pct:0},
 {id:'bearings',title:'Bearings & directions',topic:'Geometry',desc:'Use rotations and angles to explain bearings.',level:'JSS 2',detail:'North and clockwise angles',pct:0}
];
const state={role:'family',page:'Overview',selected:'sarah',learnerFilter:'All',lessonFilter:'All',modal:null,popover:null,theme:'light',session:null,step:1,questionReply:'',showHint:false,showCaptions:true,toast:'',learners:[{id:'sarah',name:'Sarah William',initials:'SW',grade:'Grade 10',subject:'Mathematics',color:'mint',curriculum:'Sample national mathematics curriculum',goal:'Understand angles in quadrilaterals',activity:'Angles & quadrilaterals',last:'Yesterday',checks:3,unaided:2},{id:'noah',name:'Noah William',initials:'NW',grade:'Grade 7',subject:'Mathematics',color:'orange',curriculum:'Sample middle-school mathematics curriculum',goal:'Strengthen work with whole numbers',activity:'Whole numbers',last:'Monday',checks:2,unaided:1}],assignments:[{title:'Angles in quadrilaterals',class:'Grade 10 Mathematics',lesson:'angles',status:'Assigned',due:'Fri, Nov 20',mode:'Individual'},{title:'Solving one-step equations',class:'Grade 10 Mathematics',lesson:'equations',status:'Draft',due:'Mon, Nov 23',mode:'Individual'}],familyInvites:[{person:'Alex William',email:'alex@example.com',role:'Caregiver',status:'Pending'}],schoolInvites:[{person:'Maya Chen',email:'maya@example.com',role:'Teacher',status:'Pending'}],recent:[],settings:{captions:true,reducedMotion:false,notifications:true},profileDraft:null};

function renderToast(){const old=document.querySelector('.toast');if(old)old.remove();if(state.toast){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=icons('check')+escapeHTML(state.toast);document.body.appendChild(el)}}

function renderTopbar(){return `<header class="topbar"><label class="searchbox"><span class="sr-only">Search lessons and people</span><input id="global-search" placeholder="Search learners, lessons, classes..." autocomplete="off" aria-label="Search learners, lessons, classes" />${icons('search')}</label><div class="top-spacer"></div><button class="round-btn" data-action="theme" title="Toggle dark mode" aria-label="Toggle dark mode">${icons(state.theme==='dark'?'sun':'moon')}</button><button class="round-btn" data-action="toggle-notifications" title="Notifications" aria-label="Notifications">${icons('bell')}</button><button class="top-account" data-action="toggle-profile" aria-label="Account and context menu"><span class="profile-bubble">SW</span><span class="top-account-text"><strong>Sarah William</strong><small>Sample account · UX prototype</small></span>${icons('chevron')}</button></header>`}
function renderPreviewbar(){return `<div class="preview-bar"><div class="preview-left">${icons('eye')} <span><strong>Prototype preview</strong> · Switch perspectives to explore role-specific flows</span></div><div class="preview-roles" role="group" aria-label="Preview as"><button class="role-pill ${state.role==='family'?'active':''}" data-action="role" data-role="family" aria-pressed="${state.role==='family'}">${icons('users')} Family</button><button class="role-pill ${state.role==='learner'?'active':''}" data-action="role" data-role="learner" aria-pressed="${state.role==='learner'}">${icons('book')} Learner</button><button class="role-pill ${state.role==='teacher'?'active':''}" data-action="role" data-role="teacher" aria-pressed="${state.role==='teacher'}">${icons('board')} Teacher</button><button class="role-pill ${state.role==='school'?'active':''}" data-action="role" data-role="school" aria-pressed="${state.role==='school'}">${icons('school')} School</button></div></div>`}

function boardGraphic(lesson='angles',compact=false){if(lesson==='equations')return `<svg viewBox="0 0 520 300" role="img" aria-label="Equation 4x plus 7 equals 19 showing subtraction of 7 from both sides"><rect width="520" height="300" rx="20" fill="#FAFAFD"/><text x="63" y="89" font-size="35" fill="#22212d" font-weight="650">4x + 7 = 19</text><path d="M102 100h70M328 100h57" stroke="#7543F2" stroke-width="3"/><text x="102" y="145" font-size="24" fill="#7651DD">− 7</text><text x="328" y="145" font-size="24" fill="#7651DD">− 7</text><path d="M62 162h405" stroke="#ebe9f1"/><text x="163" y="222" font-size="31" fill="#22212d">4x = 12</text><rect x="148" y="240" width="211" height="38" rx="12" fill="#F0E6FF"/><text x="180" y="266" font-size="19" fill="#34264c">x = 3</text></svg>`;

if(lesson==='triangles')return `<svg viewBox="0 0 520 300" role="img" aria-label="Triangle area, base times height divided by two"><rect width="520" height="300" rx="20" fill="#fafafd"/><path d="M90 217 269 51l165 166z" fill="#bfe8ff" stroke="#467aff" stroke-width="3"/><path d="M269 51V217" stroke="#7c3fe8" stroke-width="2" stroke-dasharray="6 6"/><text x="281" y="143" fill="#784be1" font-size="19">h</text><text x="248" y="241" fill="#333" font-size="15">base</text><rect x="142" y="251" width="245" height="38" rx="11" fill="#eee4ff"/><text x="171" y="277" fill="#231d39" font-size="19">A = (b × h) ÷ 2</text></svg>`;
if(lesson==='fractions')return `<svg viewBox="0 0 520 300" role="img" aria-label="Fractions as shaded parts of whole circles"><rect width="520" height="300" rx="20" fill="#fafafd"/><circle cx="167" cy="145" r="83" fill="#dfe9ff" stroke="#467aff" stroke-width="3"/><path d="M167 145V62A83 83 0 0 0 84 145Z" fill="#8152e3"/><path d="M167 62v166M84 145h166" stroke="#467aff" stroke-width="2"/><circle cx="357" cy="145" r="83" fill="#dfe9ff" stroke="#467aff" stroke-width="3"/><path d="M357 145V62A83 83 0 0 0 274 145Z" fill="#8152e3"/><path d="M357 145v83A83 83 0 0 1 274 145Z" fill="#8152e3"/><path d="M357 62v166M274 145h166" stroke="#467aff" stroke-width="2"/><text x="147" y="267" font-size="20" fill="#393044">1/4</text><text x="337" y="267" font-size="20" fill="#393044">2/4</text></svg>`;

function sessionView(){let ses=state.session,step=state.step;let speeches=['A quadrilateral has four sides. Can we turn it into shapes whose angle sum we already know?','Draw a diagonal from A to C. What two shapes do you see now?','A triangle has an angle sum of 180°. How can we use two triangles to find the quadrilateral’s angle sum?'];let title=ses.lesson==='angles'?'Draw one diagonal':(lessons.find(l=>l.id===ses.lesson)||lessons[0]).detail;return `<section class="tutor-page"><div class="tutor-topline"><div><div class="eyebrow">${escapeHTML(ses.context)} / ${escapeHTML(ses.owner)}</div><h1 style="font-size:24px;letter-spacing:-.7px;margin:0">${escapeHTML(title)}</h1><p class="body-text" style="margin:5px 0 0">Interactive board preview · ${ses.group?'Teacher-led class session':'Individual learner session'} · Step ${step+1} of 3</p></div>${btn(icons('close')+' End session','exit-tutor','secondary')}</div><div class="tutor-stage"><div class="math-board"><div class="board-caption">${icons('book')} ${escapeHTML(ses.lesson==='angles'?'Angles':'Mathematics')} <span>›</span> ${escapeHTML(title)}</div><div class="board-area">${boardGraphic(ses.lesson)}</div></div><div class="tutor-side"><div class="speech">${ses.lesson==='angles'?speeches[step]:`Let's explore ${escapeHTML((lessons.find(l=>l.id===ses.lesson)||lessons[0]).title)} using the visual board. What do you notice?`}</div>${figure()}<div class="tutor-toolbar"><button title="Read explanation" aria-label="Read explanation" data-action="narrate">${icons('volume')}</button><button class="${state.showHint?'on':''}" title="Toggle hint" aria-label="Toggle hint" data-action="hint">${icons('info')}</button><button class="${state.showCaptions?'on':''}" title="Toggle captions" aria-label="Toggle captions" data-action="captions">${icons('message')}</button></div></div></div>${state.showHint?`<div class="notice" style="width:min(715px,100%);margin:16px auto 0">${icons('info')} Hint: One diagonal splits a quadrilateral into two triangles. Each triangle has a total interior angle sum of 180°.</div>`:''}${state.questionReply?`<div class="qa-answer" role="status"><strong>Sample tutor response · Not a live AI integration</strong>${escapeHTML(state.questionReply)}</div>`:''}<form class="question-bar" data-form="question"><label class="sr-only" for="student-question">Ask a question</label><textarea id="student-question" name="question" rows="2" placeholder="Ask any question..."></textarea><div class="question-tools"><small>${icons('info')} Sample response only · no server connection</small><div class="question-actions"><button class="send" title="Ask question" aria-label="Ask question" type="submit">${icons('arrow')}</button></div></div></form><div class="board-controls">${btn(icons('back')+' Previous','prev-step','secondary',step===0?'disabled':'')}${btn(icons('volume')+' Read narration','narrate','secondary')}${btn('Next '+icons('arrow'),'next-step','primary',step===2?'disabled':'')}</div><div class="hint-banner">Session data is simulated and is not uploaded or persisted. <span class="kbd">→</span> Next step · <span class="kbd">Esc</span> Close dialog</div></section>`}
function modalContent(){if(!state.modal)return '';const modal=state.modal;let title='',desc='',body='';let large=false;
if(modal==='add-learner'){title='Create learner profile';desc='A managed learner can start without having their own email address.';body=`<form data-form="create-learner"><div class="form-grid"><div class="field full"><label for="new-name">Learner display name *</label><input id="new-name" name="name" placeholder="e.g. Alex William" required maxlength="60" /></div><div class="field"><label for="new-grade">Year or grade *</label><select id="new-grade" name="grade"><option>Grade 10</option><option>Grade 9</option><option>Grade 8</option><option>Grade 7</option><option>JSS 1</option><option>JSS 2</option><option>JSS 3</option></select></div><div class="field"><label for="new-subject">Subject</label><select id="new-subject" name="subject"><option>Mathematics</option></select></div><div class="field full"><label>Learning context</label><input value="Family / Home learning" disabled /><small>Home learning is separate from a class-owned assignment context.</small></div></div><div class="form-actions">${btn('Cancel','close-modal','secondary') }<button type="submit" class="btn primary">Create profile ${icons('arrow')}</button></div></form>`}
else if(modal==='edit-profile'){let l=state.learners.find(x=>x.id===state.profileDraft)||getLearner();title='Learner profile';desc='Profile settings and learning history are distinct. This demo edits permitted example fields.';body=`<form data-form="save-profile"><input type="hidden" name="id" value="${l.id}"/><div style="display:flex;gap:13px;align-items:center;margin-bottom:21px">${face(l)}<div><strong>${escapeHTML(l.name)}</strong><div class="muted" style="font-size:11px">Managed by family · Home context</div></div></div><div class="form-grid"><div class="field"><label for="profile-name">Display name *</label><input id="profile-name" name="name" value="${escapeHTML(l.name)}" required/></div><div class="field"><label for="profile-grade">Grade *</label><input id="profile-grade" name="grade" value="${escapeHTML(l.grade)}" required/></div><div class="field full"><label for="profile-goal">Current goal</label><input id="profile-goal" name="goal" value="${escapeHTML(l.goal)}"/></div><div class="field full"><label>Curriculum source</label><input value="${escapeHTML(l.curriculum)}" disabled /><small>In an institution-linked profile, some values may be organization controlled.</small></div></div><div class="form-actions">${btn('Cancel','close-modal','secondary')}<button type="submit" class="btn primary">Save profile</button></div></form>`}
else if(modal==='new-assignment'){title='Create assignment';desc='Assign individual work or save a draft. Sample assignments stay only in this open browser page.';body=`<form data-form="new-assignment"><div class="form-grid"><div class="field full"><label for="assign-title">Assignment title *</label><input name="title" id="assign-title" required value="Angles in quadrilaterals practice"/></div><div class="field"><label for="assign-class">Class</label><select name="class" id="assign-class"><option>Grade 10 Mathematics</option><option>Grade 9 Mathematics</option></select></div><div class="field"><label for="assign-lesson">Lesson</label><select name="lesson" id="assign-lesson">${lessons.map(l=>`<option value="${l.id}">${escapeHTML(l.title)}</option>`).join('')}</select></div><div class="field"><label for="assign-due">Due date (label)</label><input id="assign-due" name="due" value="Fri, Nov 27" /></div><div class="field"><label for="assign-status">State</label><select name="status" id="assign-status"><option>Assigned</option><option>Draft</option></select></div></div><div class="notice" style="margin-top:16px">${icons('info')} Individual work produces evidence only when actual responses are captured.</div><div class="form-actions">${btn('Cancel','close-modal','secondary')}<button type="submit" class="btn primary">Save assignment</button></div></form>`}
else if(['invite-caregiver','invite-staff','invite-learner'].includes(modal)){let staff=modal==='invite-staff',classInvite=modal==='invite-learner';title=staff?'Invite school staff':classInvite?'Invite learner to class':'Invite caregiver';desc='The invitation states the role, context and proposed access. Invitation sending is simulated.';body=`<form data-form="invite"><input name="kind" type="hidden" value="${modal}"/><div class="form-grid"><div class="field"><label for="invite-name">Name *</label><input id="invite-name" name="name" required placeholder="Full name"/></div><div class="field"><label for="invite-email">Email *</label><input id="invite-email" name="email" type="email" required placeholder="name@example.com"/></div><div class="field"><label>Role</label><select name="role"><option>${staff?'Teacher':classInvite?'Learner':'Caregiver'}</option>${staff?'<option>School administrator</option><option>Billing contact</option>':''}</select></div><div class="field"><label>Context</label><input value="${staff?'Sample school':classInvite?'Grade 10 Mathematics':'Family / Home'}" disabled /></div></div><div class="notice" style="margin-top:15px">${icons('shield')} This relationship does not automatically reveal learning histories from another workspace.</div><div class="form-actions">${btn('Cancel','close-modal','secondary')}<button type="submit" class="btn primary">Create sample invitation</button></div></form>`}
else if(modal==='guide'){large=true;title='Design handoff notes';desc='A concept prototype for discussion, inspired by the provided Tutor AI lesson-board screenshot and the management/profiles design brief.';body=`<div class="layout cols-2"><div><div class="context-card"><strong>1 · One shell, four experiences</strong><p>Use the role switcher to inspect Family, Learner, Teacher and School. The icon rail and section tabs change with the authorized context.</p></div><div class="context-card"><strong>2 · The tutor board is the centre</strong><p>Launch the sample lesson from a family, learner or teacher dashboard. The shell retains a link to the session's original context.</p></div><div class="context-card"><strong>3 · Permissions are separate from payment</strong><p>Role navigation is not proof of real authorization. School billing and administration do not automatically reveal learner histories.</p></div></div><div><div class="context-card"><strong>4 · Progress distinguishes evidence</strong><p>Lesson coverage, attempts, correct responses and hints are separate concepts. Group presentation does not prove individual understanding.</p></div><div class="context-card"><strong>5 · Designer decisions still open</strong><p>Launch audience, learner authentication, data sharing, session persistence, organization hierarchy and licenses need product decisions.</p></div><div class="context-card"><strong>6 · Prototype-only interactions</strong><p>Use the forms, role navigation, theme toggle, lesson board and sample question box. They store no production data and do not call an LLM.</p></div></div></div><div class="form-actions">${btn('Close notes','close-modal','primary')}</div>`}

else if(modal==='new-class'){title='Create a class';desc='The brief supports starting with a standalone class before school integration.';body=`<div class="context-card"><strong>Standalone class</strong><p>Create a class and begin teaching without organization setup; school linking can be added through authorized membership later.</p></div><div class="form-actions">${btn('Close','close-modal','secondary')}${btn('Explore teacher classes','go-teacher-classes')}</div>`}
else if(modal==='class-detail'){title='Grade 9 Mathematics';desc='Sample standalone class';body=`<div class="context-card"><strong>24 learners · Mathematics</strong><p>This example shows a class context not yet linked to a school. Assignments and teaching records remain associated with the class context.</p></div><div class="form-actions">${btn('Close','close-modal','secondary')}${btn('View roster','go-roster')}</div>`}
else if(modal==='search'){title='Search prototype';desc='Search for lessons, learners and example classroom destinations.';body=`<div class="field"><label for="modal-search-input">Search</label><input id="modal-search-input" placeholder="e.g. angles, Sarah, classes" oninput="window.tutorSearch(this.value)" value="${escapeHTML(state.query||'')}" /></div><div id="search-results" style="margin-top:15px">${searchResults(state.query||'')}</div>`}

function searchResults(query){let q=(query||'').trim().toLowerCase();let result=[];if(!q)return `<div class="empty">${icons('search')}<strong>Start typing to explore</strong><p>Find learning content and example learner profiles.</p></div>`;lessons.filter(l=>(l.title+' '+l.topic+' '+l.desc).toLowerCase().includes(q)).forEach(l=>result.push(`<button class="list-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" data-action="search-lesson" data-id="${l.id}"><div class="row-main">${icons('book')}<div><strong>${escapeHTML(l.title)}</strong><small>Lesson · ${escapeHTML(l.topic)}</small></div></div>${icons('arrow')}</button>`));state.learners.filter(l=>l.name.toLowerCase().includes(q)).forEach(l=>result.push(`<button class="list-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" data-action="search-learner" data-id="${l.id}"><div class="row-main">${face(l,'small')}<div><strong>${escapeHTML(l.name)}</strong><small>Learner · ${escapeHTML(l.grade)}</small></div></div>${icons('arrow')}</button>`));['Classes','Assignments','Progress','Overview'].filter(p=>p.toLowerCase().includes(q)).forEach(p=>result.push(`<button class="list-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left" data-action="search-page" data-page="${p}"><div class="row-main">${icons('chart')}<div><strong>${p}</strong><small>Current workspace page, if available</small></div></div>${icons('arrow')}</button>`));return result.length?result.join(''):`<div class="empty"><strong>No matching examples</strong><p>Try a learner name, topic or navigation page.</p></div>`}
window.tutorSearch=q=>{state.query=q;const node=document.querySelector('#search-results');if(node)node.innerHTML=searchResults(q)};
function renderPopover(){if(!state.popover)return '';if(state.popover==='notifications')return `<aside class="popover" role="dialog" aria-label="Notifications"><h3>Notifications <button data-action="close-popover" style="float:right;border:0;background:none">${icons('close')}</button></h3><div class="evidence-item"><span class="bullet-icon">${icons('file')}</span><div><strong>Sample assignment available</strong><p>Angles in quadrilaterals · Grade 10 Mathematics</p></div></div><div class="evidence-item"><span class="bullet-icon green">${icons('check')}</span><div><strong>Learning activity saved</strong><p>Recent session in the family learning context.</p></div></div></aside>`;return `<aside class="popover" role="dialog" aria-label="Account menu"><h3>Sample account <button data-action="close-popover" style="float:right;border:0;background:none">${icons('close')}</button></h3><p>Sarah William · UX prototype</p><div class="notice" style="margin:10px 0">${icons('info')} Switching context changes visible features without changing sample account identity.</div>${Object.entries(roles).map(([r,[t,ico]])=>`<button class="list-row" data-action="role" data-role="${r}" style="width:100%;border:0;background:none;text-align:left"><span class="row-main">${icons(ico)}<strong>${t}</strong></span>${state.role===r?icons('check'):icons('arrow')}</button>`).join('')}</aside>`}

function changeRole(role){if(!navs[role])return;if(state.session){toast('End the active session before switching workspace.');return}state.role=role;state.page=navs[role][0][0];state.popover=null;state.modal=null;render();window.scrollTo(0,0)}

function startTutor(id,group=false){if(state.session)return;if(id&&state.learners.some(l=>l.id===id))state.selected=id;const l=getLearner();state.session={owner:group?'Grade 10 Mathematics':l.name,context:group?'Class / Grade 10 Mathematics':state.role==='family'?'Family / Home learning':state.role==='learner'?'Personal learning':'Class assignment',group,lesson:group?'angles':(l.activity==='Whole numbers'?'whole':'angles'),returnRole:state.role,returnPage:state.page};state.step=1;state.questionReply='';state.showHint=false;state.modal=null;state.popover=null;render();window.scrollTo(0,0)}

function endSession(){if(!state.session)return;state.recent.unshift({title:(lessons.find(l=>l.id===state.session.lesson)||lessons[0]).title,name:state.session.owner,context:state.session.context});state.recent=state.recent.slice(0,5);const role=state.session.returnRole,page=state.session.returnPage;state.session=null;state.modal=null;state.questionReply='';state.role=role;state.page=page;render();window.scrollTo(0,0);toast('Demo session ended · sample activity added to this page session')}

function handleClick(e){let el=e.target.closest('[data-action]');if(!el){if(e.target.matches('[data-overlay="true"]')){state.modal=null;render()}return}const action=el.dataset.action;switch(action){

function handleSubmit(e){const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const d=new FormData(f);switch(f.dataset.form){
case 'create-learner':{let name=String(d.get('name')||'').trim();if(!name)return;let id='learner-'+Math.random().toString(36).slice(2,9);state.learners.push({id,name,initials:name.split(' ').slice(0,2).map(w=>w[0]?.toUpperCase()).join(''),grade:d.get('grade'),subject:d.get('subject'),color:'mint',curriculum:'Sample mathematics curriculum',goal:'Discover a mathematics topic',activity:'Angles & quadrilaterals',last:'Not yet started',checks:0,unaided:0});state.selected=id;state.modal=null;state.role='family';state.page='Learners';render();toast('Learner profile added to this demo');break;}
case 'save-profile':{const l=state.learners.find(x=>x.id===d.get('id'));if(l){l.name=String(d.get('name')).trim();l.grade=String(d.get('grade'));l.goal=String(d.get('goal'))}state.modal=null;render();toast('Example profile updated');break;}
case 'new-assignment':{state.assignments.unshift({title:String(d.get('title')).trim(),class:String(d.get('class')),lesson:String(d.get('lesson')),due:String(d.get('due')),status:String(d.get('status')),mode:'Individual'});state.modal=null;state.role='teacher';state.page='Assignments';render();toast('Sample assignment created');break;}
case 'invite':{const name=String(d.get('name')).trim(),email=String(d.get('email')).trim(),role=String(d.get('role'));if(d.get('kind')==='invite-caregiver')state.familyInvites.push({person:name,email,role,status:'Pending'});else state.schoolInvites.push({person:name,email,role,status:'Pending'});state.modal=null;render();toast('Sample invitation created; no email sent');break;}
case 'question':{const q=String(d.get('question')||'').trim();if(!q)return;state.questionReply=/diagonal/i.test(q)?'The diagonal divides the quadrilateral into two triangles. Each triangle has an interior angle sum of 180°, so together they make 360°.':/180|360|sum|angle/i.test(q)?'The sum of angles inside each triangle is 180°. Two non-overlapping triangles therefore have 180° + 180° = 360° in total.':'Try identifying the two triangles formed by the diagonal. The explanation here is a fixed demo response; a real Tutor AI connection is not included.';render();break;}
}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.popover)){state.modal=null;state.popover=null;render()}if(e.key==='ArrowRight'&&state.session&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){state.step=Math.min(2,state.step+1);render()}});document.addEventListener('focusin',e=>{if(e.target.id==='global-search'){e.target.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();state.query=ev.target.value;state.modal='search';render();setTimeout(()=>document.getElementById('modal-search-input')?.focus(),20)}} ,{once:true})}});
render();
})();
</script>
</body>
</html>
